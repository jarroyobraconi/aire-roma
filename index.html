<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Aire Roma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="info">cargando datos...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>
    const API_KEY = 'a2c2380338fc93cdd08700bc684264c7f34308b8463a0084b4fb652603058795';
    const SENSORES = {
      pm25: 21806,
      no2:  21941,
      o3:   21947,
      pm10: 21807
    };

    let datos = { pm25: 150, no2: 200, o3: 80, pm10: 100 };
    let target = { ...datos };

    async function fetchDatos() {
  try {
    const res = await fetch('aire.json');
    const json = await res.json();
    target.pm25 = json.pm25;
    target.no2  = json.no2;
    target.o3   = json.o3;
    target.pm10 = json.pm10;
    actualizarInfo();
  } catch(e) {
    console.log('usando datos de fallback', e);
  }
}

    function actualizarInfo() {
      document.getElementById('info').innerHTML =
        `Roma, Italia<br>
         pm2.5: ${target.pm25} µg/m³<br>
         no₂: ${target.no2} µg/m³<br>
         o₃: ${target.o3} µg/m³<br>
         pm10: ${target.pm10} µg/m³`;
    }

    new p5(function(p) {
      let t = 0;

      p.setup = function() {
        p.createCanvas(window.innerWidth, window.innerHeight).parent(document.body);
        p.noFill();
        fetchDatos();
        setInterval(fetchDatos, 3600000);
      };

      p.draw = function() {
        datos.pm25 += (target.pm25 - datos.pm25) * 0.01;
        datos.no2  += (target.no2  - datos.no2)  * 0.01;
        datos.o3   += (target.o3   - datos.o3)   * 0.01;
        datos.pm10 += (target.pm10 - datos.pm10) * 0.01;

        const velocidad = 0.004 + datos.no2 / 8000;
        const amplitud  = 30 + datos.o3 * 2;
        const densidad  = Math.min(datos.pm25 / 80, 1);
        const hue       = p.map(datos.pm10, 0, 100, 140, 0);

        p.background(10, 10, 15, 25);
        p.colorMode(p.HSB, 360, 100, 100, 100);

        for (let i = 0; i < 7; i++) {
          const yBase = p.height * (0.2 + i * 0.1);
          const alpha = 60 - i * 6;
          const grosor = 1 + i * 0.4;

          p.stroke(hue + i * 10, 70, 80, alpha);
          p.strokeWeight(grosor);
          p.beginShape();
          for (let x = 0; x <= p.width; x += 3) {
            const y = yBase
              + p.sin(x * 0.006 + t + i) * amplitud
              + p.sin(x * 0.012 + t * 1.3 + i * 0.7) * amplitud * 0.4
              + p.sin(x * 0.003 + t * 0.7) * amplitud * densidad * 0.5;
            p.curveVertex(x, y);
          }
          p.endShape();
        }

        for (let i = 0; i < 80; i++) {
          const px = p.noise(i * 0.3, t * 0.2) * p.width;
          const py = p.noise(i * 0.3 + 100, t * 0.2) * p.height;
          const r  = densidad * 2.5;
          p.stroke(hue, 50, 90, 40);
          p.strokeWeight(r);
          p.point(px, py);
        }

        t += velocidad;
      };

      p.windowResized = function() {
        p.resizeCanvas(window.innerWidth, window.innerHeight);
      };
    });
  </script>
</body>
</html>
